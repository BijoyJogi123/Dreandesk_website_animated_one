    <!-- JavaScript to draw video inside text using Canvas -->
    <script>
        const canvas = document.getElementById('textCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('sourceVideo');
        const text = 'DREAM';
        let animationId = null;

        // Get responsive font size based on window width
        function getResponsiveFontSize() {
            const width = window.innerWidth;
            if (width <= 375) return 100;
            if (width <= 480) return 120;
            if (width <= 768) return 160;
            if (width <= 1024) return 240;
            if (width <= 1200) return 320;
            if (width <= 1400) return 380;
            return 440;
        }

        // Get responsive stroke width
        function getResponsiveStrokeWidth() {
            const width = window.innerWidth;
            if (width <= 768) return 1;
            if (width <= 1024) return 1.5;
            return 2;
        }

        // Function to setup canvas
        function setupCanvas() {
            const fontSize = getResponsiveFontSize();
            
            // Set font to measure text - using Geist 900 (matching Career.html)
            ctx.font = `900 ${fontSize}px "Geist", sans-serif`;
            const metrics = ctx.measureText(text);
            const textWidth = metrics.width;
            const textHeight = fontSize * 1.2;

            // Set high DPI
            const dpr = window.devicePixelRatio || 1;
            canvas.style.width = textWidth + 'px';
            canvas.style.height = textHeight + 'px';
            canvas.width = textWidth * dpr;
            canvas.height = textHeight * dpr;
            ctx.scale(dpr, dpr);
        }

        function drawVideoInText() {
            if (video.paused || video.ended) {
                video.play().catch(e => console.log('Video play failed:', e));
            }

            const fontSize = getResponsiveFontSize();
            const dpr = window.devicePixelRatio || 1;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Save context
            ctx.save();

            // Draw video scaled to canvas
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width / dpr, canvas.height / dpr);
            }

            // Set composite operation to show video only in text
            ctx.globalCompositeOperation = 'destination-in';

            // Draw text mask - using Geist 900 (matching Career.html)
            ctx.font = `900 ${fontSize}px "Geist", sans-serif`;
            ctx.textBaseline = 'top';
            ctx.fillStyle = '#000';
            ctx.fillText(text, 0, 0);

            // Restore context
            ctx.restore();

            // Continue animation
            animationId = requestAnimationFrame(drawVideoInText);
        }

        // Start animation when video can play
        video.addEventListener('canplay', () => {
            video.play().then(() => {
                drawVideoInText();
            }).catch(e => {
                console.log('Autoplay prevented, trying again...', e);
                // Try to play on user interaction
                document.addEventListener('click', () => {
                    video.play();
                    drawVideoInText();
                }, { once: true });
            });
        });

        // Fallback: start immediately if video is already loaded
        if (video.readyState >= 3) {
            video.play().then(() => {
                drawVideoInText();
            }).catch(e => console.log('Video play error:', e));
        }

        // Handle window resize with debouncing
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                // Cancel current animation
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                // Reconfigure canvas
                setupCanvas();
                // Restart animation
                drawVideoInText();
            }, 250);
        });

        // Handle touch events for mobile video playback
        document.addEventListener('touchstart', () => {
            if (video.paused) {
                video.play().catch(e => console.log('Touch play failed:', e));
            }
        }, { once: true });

        // Initial setup
        setupCanvas();
    </script>
