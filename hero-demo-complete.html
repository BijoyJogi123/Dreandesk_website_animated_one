<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamDesk Hero - Firma Style</title>
  
  <!-- Fonts from Career.html -->
  <style>
    /* Geist Font */
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 900;
      src: url(https://fonts.gstatic.com/s/geist/v4/gyBhhwUxId8gMGYQMKR3pzfaWI_RNeQImpna.woff2) format('woff2');
    }
    
    /* Caveat Font */
    @font-face {
      font-family: 'Caveat';
      font-style: normal;
      font-weight: 400;
      src: url(https://fonts.gstatic.com/s/caveat/v23/Wnz6HAc5bAfYB2Q7ZjYY.woff2) format('woff2');
    }
  </style>

  <!-- Complete CSS from Career.html -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Geist', sans-serif;
      background: #000;
      overflow-x: hidden;
    }

    /* Main Container */
    .framer-ll2u5v {
      background-color: #fff;
      display: flex;
      flex-direction: row;
      place-content: center;
      align-items: center;
      width: 100%;
      min-width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .framer-1eiawcr {
      background-color: #fff;
      z-index: 1;
      width: 2200px;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Text Container - Top */
    .framer-3y1b7i {
      z-index: 1;
      width: 695px;
      height: 300px;
      position: absolute;
      top: calc(33.75% - 150px);
      left: 360px;
      overflow: visible;
    }

    .framer-1kfwg09 {
      will-change: transform;
      display: flex;
      flex-direction: column;
      place-content: flex-end center;
      align-items: flex-end;
      gap: 32px;
      width: min-content;
      height: min-content;
      position: absolute;
      top: 58px;
      right: 0;
      overflow: visible;
      opacity: 1;
      transform: none;
    }

    .framer-dnb8d0 {
      user-select: none;
      width: auto;
      height: auto;
      position: relative;
      transform: none;
    }

    .framer-dnb8d0 p {
      white-space: nowrap;
      padding-top: 20px;
      font-family: 'Caveat', sans-serif;
      font-size: 120px;
      letter-spacing: -0.07em;
      line-height: 70%;
      text-align: center;
      color: #000;
      margin: 0;
    }

    .framer-su7jo2 {
      pointer-events: auto;
      word-break: break-word;
      word-wrap: break-word;
      z-index: 1;
      width: 95%;
      height: auto;
      position: relative;
      transform: none;
    }

    .framer-su7jo2 p {
      font-family: 'Geist', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #888;
      margin: 0;
    }

    .framer-su7jo2 strong {
      color: #000;
      font-weight: 700;
    }

    /* Main Title Container */
    .framer-5tvmqk-container {
      pointer-events: auto;
      width: auto;
      height: auto;
      position: absolute;
      top: 0;
      left: 0;
    }

    .framer-J6ugj {
      opacity: 1;
      position: relative;
    }

    .framer-1ebgzuc {
      --framer-paragraph-spacing: 0px;
      transform: translateY(-50%);
      opacity: 1;
      position: relative;
    }

    .framer-1ebgzuc h2 {
      font-family: 'Geist', sans-serif;
      font-size: 48px;
      font-weight: 400;
      line-height: 1.2;
      color: #000;
      margin: 0;
      text-align: left;
    }

    .framer-1ebgzuc h2 span span {
      display: inline-block;
      will-change: transform;
    }

    /* Large Text Container - Bottom */
    .framer-rqqsrm {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      place-content: center;
      align-items: center;
      gap: 16px;
      width: min-content;
      height: min-content;
      position: absolute;
      top: 84%;
      left: 343px;
      overflow: visible;
      transform: translateY(-50%);
      z-index: 2;
    }

    .framer-jcul6d {
      user-select: none;
      width: auto;
      height: auto;
      position: relative;
      transform: rotate(-4deg);
    }

    .framer-jcul6d {
      position: relative;
      user-select: none;
      width: auto;
      height: auto;
      transform: rotate(-4deg);
    }

    .framer-jcul6d p {
      margin: 0;
      font-family: 'Geist', sans-serif;
      font-size: 440px;
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 90%;
      text-transform: uppercase;
      white-space: nowrap;
      position: relative;
      z-index: 2;
      
      /* Hollow text with stroke */
      color: transparent;
      -webkit-text-stroke: 2px #000;
      text-stroke: 2px #000;
    }

    .framer-jcul6d p span span {
      display: inline-block;
      will-change: transform;
    }

    /* Video Container - positioned behind text with mask */
    .text-video-mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .text-video-mask video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      
      /* Clip video to text shape using mix-blend-mode */
      mix-blend-mode: screen;
      opacity: 0.9;
    }

    /* Alternative: Use background video clipped to text */
    .framer-jcul6d::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('Sections_svgs/admission_video.mp4');
      background-size: cover;
      background-position: center;
      z-index: 0;
      -webkit-mask: linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0);
      -webkit-mask-composite: source-in;
      mask-composite: intersect;
    }

    /* Video Container - Background */
    .framer-1gqk893 {
      user-select: none;
      aspect-ratio: 3.19549;
      height: 532px;
      pointer-events: none;
      z-index: 0;
      width: 1700px;
      position: absolute;
      top: 84%;
      left: 355px;
      overflow: hidden;
      transform: translateY(-50%);
      mix-blend-mode: lighten;
      opacity: 0.3;
    }

    .framer-ufrxrf-container {
      position: absolute;
      inset: 0;
    }

    .framer-ufrxrf-container video {
      transform: rotate(0deg);
      cursor: auto;
      width: 100%;
      height: 100%;
      border-radius: 0px;
      display: block;
      object-fit: cover;
      background-color: rgba(0, 0, 0, 0);
      object-position: 50% 50%;
    }

    /* Hidden classes for responsive */
    .hidden-a1qw1e,
    .hidden-1qkvzkg {
      display: block;
    }

    .ssr-variant {
      display: block;
    }

    /* Responsive Design */
    @media (max-width: 1400px) {
      .framer-1eiawcr {
        width: 1800px;
      }
      
      .framer-jcul6d p {
        font-size: 360px;
      }
      
      .framer-1gqk893 {
        width: 1400px;
        height: 438px;
      }
    }

    @media (max-width: 1200px) {
      .framer-1eiawcr {
        width: 1400px;
      }
      
      .framer-3y1b7i {
        width: 600px;
        left: 200px;
      }
      
      .framer-rqqsrm {
        left: 200px;
      }
      
      .framer-jcul6d p {
        font-size: 280px;
      }
      
      .framer-1gqk893 {
        width: 1100px;
        height: 344px;
        left: 200px;
      }
    }

    @media (max-width: 1024px) {
      .framer-ll2u5v {
        flex-direction: column;
      }
      
      .framer-1eiawcr {
        width: 100%;
      }
      
      .framer-3y1b7i {
        width: 90%;
        left: 5%;
        top: 10%;
      }
      
      .framer-1kfwg09 {
        align-items: center;
        right: auto;
        left: 50%;
        transform: translateX(-50%);
      }
      
      .framer-dnb8d0 p {
        font-size: 80px;
      }
      
      .framer-rqqsrm {
        left: 50%;
        transform: translate(-50%, -50%);
        top: 70%;
      }
      
      .framer-jcul6d p {
        font-size: 200px;
        margin-bottom: 150px;
      }
      
      .framer-1gqk893 {
        width: 90%;
        height: 281px;
        left: 5%;
        top: 70%;
      }
    }

    @media (max-width: 768px) {
      .framer-dnb8d0 p {
        font-size: 60px;
      }
      
      .framer-su7jo2 p {
        font-size: 14px;
      }
      
      .framer-1ebgzuc h2 {
        font-size: 32px;
      }
      
      .framer-jcul6d p {
        font-size: 120px;
        margin-bottom: 80px;
        -webkit-text-stroke: 1.5px #000;
        text-stroke: 1.5px #000;
      }
      
      .framer-1gqk893 {
        height: 188px;
      }
    }

    @media (max-width: 480px) {
      .framer-dnb8d0 p {
        font-size: 40px;
      }
      
      .framer-su7jo2 p {
        font-size: 12px;
      }
      
      .framer-1ebgzuc h2 {
        font-size: 24px;
      }
      
      .framer-jcul6d p {
        font-size: 80px;
        margin-bottom: 50px;
        -webkit-text-stroke: 1px #000;
        text-stroke: 1px #000;
      }
      
      .framer-1gqk893 {
        height: 125px;
      }
    }
  </style>
</head>
<body>

  <!-- EXACT Hero Section from Career.html -->
  <div class="framer-ll2u5v" data-framer-name="Main Container">
    <div class="framer-1eiawcr" data-framer-name="Home" id="home">
      
      <!-- Top Text Container -->
      <div class="framer-3y1b7i" data-framer-name="Text Container">
        <div class="ssr-variant hidden-a1qw1e hidden-1qkvzkg">
          <div class="framer-1kfwg09" data-framer-appear-id="1kfwg09" data-framer-name="Text Container">
            <div class="framer-dnb8d0" data-framer-component-type="RichTextContainer">
              <p>At Dream Desk.</p>
            </div>
            <div class="framer-su7jo2" data-framer-component-type="RichTextContainer">
              <p>
                We are committed to building a supportive, inclusive, and employee-focused workplace.
                <strong>Dream, Work, Success.</strong>
              </p>
            </div>
          </div>
        </div>

        <div class="framer-5tvmqk-container hidden-1qkvzkg hidden-a1qw1e">
          <div class="framer-J6ugj framer-IORtY framer-yfknkv framer-v-1l1lvn4" data-framer-name="Start" data-highlight="true">
            <!-- Main Title -->
            <div class="framer-1ebgzuc" data-framer-component-type="RichTextContainer">
              <h2>
                <span><span>J</span><span>o</span><span>i</span><span>n</span></span>
                <span>&nbsp;<span>p</span><span>e</span><span>o</span><span>p</span><span>l</span><span>e</span></span>
                <span>&nbsp;<span>w</span><span>h</span><span>o</span></span>
                <span>&nbsp;<span>b</span><span>e</span><span>l</span><span>i</span><span>e</span><span>v</span><span>e</span></span>
                <span>&nbsp;<span>y</span><span>o</span><span>u</span><span>r</span></span>
                <span><span>n</span><span>e</span><span>x</span><span>t</span></span>
                <span>&nbsp;<span>b</span><span>i</span><span>g</span></span>
                <span>&nbsp;<span>d</span><span>r</span><span>e</span><span>a</span><span>m</span></span>
                <span>&nbsp;<span>d</span><span>e</span><span>s</span><span>e</span><span>r</span><span>v</span><span>e</span><span>s</span></span>
                <span>&nbsp;<span>t</span><span>h</span><span>e</span></span>
                <span>&nbsp;<span>b</span><span>e</span><span>s</span><span>t</span></span>
              </h2>
            </div>
          </div>
        </div>
      </div>

      <!-- Large Text at Bottom with Video Inside -->
      <div class="ssr-variant hidden-a1qw1e hidden-1qkvzkg">
        <div class="framer-rqqsrm" data-framer-name="Name Container" id="rqqsrm" tabindex="0">
          <div class="framer-jcul6d" data-framer-component-type="RichTextContainer">
            <!-- Video positioned behind text -->
            <div class="text-video-mask">
              <video src="Sections_svgs/admission_video.mp4" loop preload="auto" muted playsinline autoplay></video>
            </div>
            <!-- Text with stroke -->
            <p>
              <span>
                <span>D</span>
                <span>R</span>
                <span>E</span>
                <span>A</span>
                <span>M</span>
              </span>
            </p>
          </div>
        </div>
      </div>

      <!-- Background Video Container (subtle) -->
      <div class="framer-1gqk893" data-framer-name="Video Container">
        <div class="framer-ufrxrf-container">
          <video src="Sections_svgs/admission_video.mp4" loop preload="auto" muted playsinline autoplay></video>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
