<head>

  <!-- Fonts -->
  <style>
    @font-face {
      font-family: 'Geist';
      font-style: normal;

    }
    
    @font-face {

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Geist', sans-serif;
      background: #000;
      overflow-x: hidden;
    }

    .framer-ll2u5v {
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .framer-1eiawcr {
      background-color: #fff;
      z-index: 1;
      width: 2200px;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Top Text */
    .framer-3y1b7i {
      z-index: 3;
      width: 695px;
      position: absolute;
      top: calc(33.75% - 150px);
      left: 360px;
    }

    .framer-1kfwg09 {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 32px;
      position: absolute;
      top: 58px;
      right: 0;
    }

    .framer-dnb8d0 p {
      font-family: 'Caveat', sans-serif;
      font-size: 120px;
      letter-spacing: -0.07em;
      line-height: 70%;
      text-align: center;
      color: #000;
      white-space: nowrap;
      padding-top: 20px;
    }

    .framer-su7jo2 p {
      font-family: 'Geist', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #888;
      width: 95%;
    }

    .framer-su7jo2 strong {
      color: #000;
      font-weight: 700;
    }

    .framer-1ebgzuc h2 {
      font-family: 'Geist', sans-serif;
      font-size: 48px;
      font-weight: 400;
      line-height: 1.2;
      color: #000;
    }

    .framer-1ebgzuc h2 span span {
      display: inline-block;
    }

    /* Large Text with Video Inside - THE KEY PART */
    .framer-rqqsrm {
      position: absolute;
      top: 84%;
      left: 343px;
      transform: translateY(-50%) rotate(-4deg);
      z-index: 2;
    }

    .text-video-wrapper {
      position: relative;
      display: inline-block;
    }

    /* The actual text */
    .large-text {
      font-family: 'Geist', sans-serif;
      font-size: 440px;
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 90%;
      text-transform: uppercase;
      margin: 0;
      padding: 0;
      white-space: nowrap;
      position: relative;
      z-index: 2;
      
      /* Make text transparent with stroke */
      color: transparent;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 2px #000;
      text-stroke: 2px #000;
      
      /* Video as background clipped to text */
      background: url('Sections_svgs/admission_video.mp4');
      background-size: cover;
      background-position: center;
      -webkit-background-clip: text;
      background-clip: text;
    }

    /* Video element positioned behind text */
    .video-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      z-index: 1;
      mix-blend-mode: screen;
      opacity: 0.85;
    }

    .video-layer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Background video (subtle) */
    .framer-1gqk893 {
      position: absolute;
      top: 84%;
      left: 355px;
      transform: translateY(-50%);
      width: 1700px;
      height: 532px;
      z-index: 0;
      mix-blend-mode: lighten;
      opacity: 0.2;
      overflow: hidden;
    }

    .framer-1gqk893 video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Responsive */
    @media (max-width: 1400px) {
      .framer-1eiawcr { width: 1800px; }
      .large-text { font-size: 360px; }
      .framer-1gqk893 { width: 1400px; height: 438px; }
    }

    @media (max-width: 1200px) {
      .framer-1eiawcr { width: 1400px; }
      .framer-3y1b7i { width: 600px; left: 200px; }
      .framer-rqqsrm { left: 200px; }
      .large-text { font-size: 280px; }
      .framer-1gqk893 { width: 1100px; height: 344px; left: 200px; }
    }

    @media (max-width: 1024px) {
      .framer-1eiawcr { width: 100%; }
      .framer-3y1b7i { width: 90%; left: 5%; top: 10%; }
      .framer-1kfwg09 { align-items: center; left: 50%; transform: translateX(-50%); right: auto; }
      .framer-dnb8d0 p { font-size: 80px; }
      .framer-rqqsrm { left: 50%; transform: translate(-50%, -50%) rotate(-4deg); top: 70%; }
      .large-text { font-size: 200px; }
      .framer-1gqk893 { width: 90%; height: 281px; left: 5%; top: 70%; }
    }

    @media (max-width: 768px) {
      .framer-dnb8d0 p { font-size: 60px; }
      .framer-su7jo2 p { font-size: 14px; }
      .framer-1ebgzuc h2 { font-size: 32px; }
      .large-text { 
        font-size: 120px;
        -webkit-text-stroke: 1.5px #000;
        text-stroke: 1.5px #000;
      }
      .framer-1gqk893 { height: 188px; }
    }

    @media (max-width: 480px) {
      .framer-dnb8d0 p { font-size: 40px; }
      .framer-su7jo2 p { font-size: 12px; }
      .framer-1ebgzuc h2 { font-size: 24px; }
      .large-text { 
        font-size: 80px;
        -webkit-text-stroke: 1px #000;
        text-stroke: 1px #000;
      }
      .framer-1gqk893 { height: 125px; }
    }
  </style>
</head>
